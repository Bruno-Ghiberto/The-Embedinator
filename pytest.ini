[pytest]
asyncio_mode = auto
testpaths = tests
# Exclude quality/ — ragas.executor calls nest_asyncio.apply() at module level
# which poisons the asyncio loop for all tests in the session (Python 3.14 + anyio 4.x).
# Run quality tests explicitly: zsh scripts/run-tests-external.sh -n <name> tests/quality/
norecursedirs = tests/quality .venv .git __pycache__ build dist
markers =
    e2e: backend Python E2E tests (in-process ASGI via httpx)
    require_docker: tests requiring Qdrant on localhost:6333 (auto-skipped when unavailable)
    require_server: real-socket E2E tests that spawn uvicorn subprocesses (tests/e2e_real/; opt-in via E2E_REAL=1)
addopts = --cov=backend --cov-report=term-missing --cov-fail-under=80
